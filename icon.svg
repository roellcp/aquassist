<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#060E1E"/>
      <stop offset="100%" stop-color="#0A162B"/>
    </linearGradient>

    <!-- Droplet Primary Gradient (Electric Cyan to Bio-Emerald) -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#00D2FF"/>
      <stop offset="80%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Droplet Ambient Glow -->
    <radialGradient id="dropAura" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00F5A0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Wave / Fin Ribbon Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040915" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0A162B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Specular Light Sheen (Apple-style Glass Refraction) -->
    <linearGradient id="sheenGrad" x1="20%" y1="0%" x2="60%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Wave Accent -->
    <linearGradient id="accentWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Outer Squircle Bevel Highlight -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Canvas -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  
  <!-- Ambient Core Glow behind droplet -->
  <circle cx="256" cy="290" r="180" fill="url(#dropAura)"/>

  <!-- Specular 1px Squircle Border Edge -->
  <rect x="3" y="3" width="506" height="506" rx="121" fill="none" stroke="url(#squircleBorder)" stroke-width="2"/>

  <!-- ================= THE DROPLET & INTERNAL WAVE ================= -->
  <g filter="url(#dropShadow)">
    
    <!-- Primary Luminous Water Droplet -->
    <path d="M 256 88 
             C 246 104, 136 256, 136 332 
             C 136 398, 190 450, 256 450 
             C 322 450, 376 398, 376 332 
             C 376 256, 266 104, 256 88 Z" 
          fill="url(#dropGrad)"/>

    <!-- Inner Ergonomic Wave / Fin Contour (Negative Space Abyss) -->
    <path d="M 256 450 
             C 200 450, 150 405, 150 345 
             C 150 280, 210 240, 260 215 
             C 295 198, 320 172, 335 142 
             C 360 210, 368 285, 345 345 
             C 325 398, 290 435, 256 450 Z" 
          fill="url(#waveGrad)"/>

    <!-- Glowing Bio-Fin Wave Crest (Sweeping Inner Ripple) -->
    <path d="M 172 375 
             C 185 305, 230 250, 280 215 
             C 310 194, 332 165, 342 135" 
          stroke="url(#accentWaveGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          filter="url(#softGlow)"/>

    <!-- Specular Light Sheen Reflection on Droplet Surface -->
    <path d="M 254 105 
             C 246 118, 158 248, 154 315 
             C 150 380, 185 425, 230 440 
             C 190 425, 165 375, 168 322 
             C 172 265, 245 140, 254 105 Z" 
          fill="url(#sheenGrad)"/>

    <!-- Tiny AI Light Spark (Refraction Sparkle at apex) -->
    <circle cx="342" cy="135" r="4.5" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="342" cy="135" r="2" fill="#00D2FF"/>
  </g>
</svg>